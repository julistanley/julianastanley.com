# Nightly export of the published website content into this repo:
# snapshots/entries.json is the backup, the site's fallback, and the daily
# activity that keeps the free Supabase project from pausing. Also rebakes
# the route stubs (scripts/bake.sh) so new posts get their URL. Uses the
# public anon key from js/config.js, so there are no secrets to configure;
# drafts are not exported (this repo is public). Commits only on changes.
name: Nightly content snapshot

on:
  schedule:
    - cron: '43 6 * * *'        # 06:43 UTC daily (odd minute avoids the rush)
  workflow_dispatch:            # run it by hand from the Actions tab
  push:
    branches: [main]
    paths: [index.html]         # shell changed -> stubs must be rebaked

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export published entries
        run: |
          set -euo pipefail
          URL=$(sed -n "s/^export const SUPABASE_URL = '\([^']*\)'.*/\1/p" js/config.js)
          KEY=$(sed -n "s/^export const SUPABASE_ANON_KEY = '\([^']*\)'.*/\1/p" js/config.js)
          if [ -z "$URL" ] || [ "${URL#REPLACE}" != "$URL" ]; then
            echo "Supabase not configured yet; nothing to export."; exit 0
          fi
          FIELDS='kind,slug,title,description,date,nav_order,published,body,updated_at'
          # One page is plenty: PostgREST returns up to 1000 rows per request
          # and this site has a few dozen entries.
          curl -fsS "$URL/rest/v1/entries?select=$FIELDS&published=eq.true&order=slug.asc&limit=1000" \
            -H "apikey: $KEY" | python3 -m json.tool > snapshots/entries.json

      - name: Rebake route stubs and sitemap
        run: bash scripts/bake.sh

      - name: Keepalive after a quiet stretch
        run: |
          # GitHub disables a schedule after 60 days without commits. Content
          # edits reset that (the snapshot commit below), but a quiet couple
          # of months would not - and if the schedule stops, so does the
          # daily query that keeps the free Supabase project awake. So once
          # the last commit is 50+ days old, change a marker file; the commit
          # step below then has something to commit.
          last=$(git log -1 --format=%ct)
          age_days=$(( ( $(date +%s) - last ) / 86400 ))
          if [ "$age_days" -ge 50 ]; then
            date -u +%Y-%m-%dT%H:%MZ > snapshots/.keepalive
            echo "Last commit is $age_days days old; keepalive commit."
          fi

      - name: Commit if anything changed
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes since last snapshot."
          else
            git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
